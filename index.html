<style>
:root{--bg:#eef3f8;--card:#ffffff;--primary:#3b82c4;--primary2:#e8815b;--text:#2c2c3a;--sub:#6b7280;--border:#dde4ed;--shadow:0 2px 8px rgba(0,0,0,.05);--radius:10px;
  --hdrbg:#dce8f4;--hdrtext:#1a1a2e;--sum:#fef9f0;--g1:#fff3e4;--g2:#f0eaf8;--g3:#feffe6;--sumedge:#e0cfb0;--accent-blue:#c5ddf6;--accent-yellow:#fff3d6;--accent-pink:#fde4d8;
  --toolbar-bg:linear-gradient(135deg,#3b82c4,#2563a0);--toolbar-text:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.toolbar{background:var(--toolbar-bg);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(59,130,196,.25)}
.toolbar h1{font-size:18px;font-weight:700;color:var(--toolbar-text);letter-spacing:.5px}
.toolbar .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.updated-at{font-size:11px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.12);padding:5px 12px;border-radius:6px}
.upload-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:rgba(255,255,255,.18);color:var(--toolbar-text);border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.upload-btn:hover{background:rgba(255,255,255,.28)}.upload-btn input{display:none}
.reset-btn{display:inline-flex;align-items:center;gap:4px;padding:9px 14px;background:rgba(255,255,255,.15);color:var(--toolbar-text);border:1px solid rgba(255,255,255,.25);border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s}
#dropOverlay{position:fixed;inset:0;background:rgba(126,176,200,.1);z-index:999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#dropOverlay.active{display:flex}
#dropOverlay .box{padding:48px 64px;background:var(--card);border:3px dashed var(--primary);border-radius:16px;font-size:18px;font-weight:600;color:var(--primary)}
.tabs{display:flex;background:var(--card);border-bottom:2px solid #e0e8f0;padding:0 24px;overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.tab-btn{padding:14px 20px;border:none;background:none;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab-btn.active,.tab-btn:hover{color:var(--primary);border-bottom-color:var(--primary);background:rgba(59,130,196,.04)}
.main{padding:20px 24px;max-width:1800px;margin:0 auto}
.data-table{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.data-table .wrap{overflow-x:auto;max-height:70vh}
.data-table table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th,.data-table td{padding:7px 12px;text-align:center}
.data-table th{background:var(--hdrbg);color:var(--hdrtext);font-weight:700;font-size:12px;border-bottom:2px solid #b8cce0;position:sticky;top:0;z-index:1;text-transform:uppercase;letter-spacing:.3px}
.data-table td{border-bottom:1px solid #f0edeb;white-space:nowrap}
.data-table tr:hover td{background:#f2f6fb}
.data-table .tl{text-align:left}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums}
.data-table .sum-row td{font-weight:700;background:var(--sum);border-top:2px solid var(--sumedge);position:sticky;bottom:0}
.data-table .hl-1 td{background:#fff3e0;font-weight:700;color:#c07020}
.data-table .hl-2 td{background:#f0eaf6;font-weight:600;color:#7050a0}
.data-table .hl-3 td{background:#feffe4;font-weight:600;color:#808020}
.chart-card{background:var(--card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:20px}
.chart-card .ctitle{font-size:14px;font-weight:600;margin-bottom:12px}
.chart-card canvas{max-height:300px}
.kpi-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.kpi-item{background:var(--card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);min-width:140px;flex:1;border-left:4px solid var(--primary);transition:transform .15s}
.kpi-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kpi-item:nth-child(2){border-left-color:#f0a050}
.kpi-item:nth-child(3){border-left-color:#50b890}
.kpi-item:nth-child(4){border-left-color:#c080d0}
.kpi-item .kl{font-size:11px;color:var(--sub);margin-bottom:4px}
.kpi-item .kv{font-size:20px;font-weight:700}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text);padding-left:12px;border-left:4px solid var(--primary)}
.rank-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;padding:16px 20px}
.rank-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
.rank-table th,.rank-table td{padding:10px 16px;text-align:center;border-bottom:1px solid #f0edeb;white-space:nowrap}
.rank-table th{color:var(--hdrtext);font-weight:700;font-size:11px;background:var(--hdrbg);letter-spacing:.3px}
.rank-table .tl{text-align:left}
.rank-table .num{text-align:right}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.rank-badge.r1{background:linear-gradient(135deg,#f0a030,#d08020)}.rank-badge.r2{background:linear-gradient(135deg,#a0a0b8,#808098)}.rank-badge.r3{background:linear-gradient(135deg,#d4a060,#b08040)}.rank-badge.rn{background:#d8d4d0;color:#888}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-row select,.filter-row input{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card)}
.filter-row input{width:100px}
@media(max-width:768px){.main{padding:12px}.tabs{padding:0 8px}.tab-btn{padding:10px 12px;font-size:11px}.rank-table th,.rank-table td{padding:8px 10px;font-size:12px}}
/* Password Gate */
.pwd-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#e8f4f8 0%,#f8f0e8 50%,#e8f0e8 100%);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.pwd-box{background:#fff;border-radius:16px;padding:40px 36px;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center;max-width:380px;width:90%}
.pwd-box h2{font-size:22px;margin:0 0 8px;color:#333}
.pwd-box .sub{font-size:13px;color:#999;margin-bottom:24px}
.pwd-box input{width:100%;padding:12px 16px;border:2px solid #e8e8e8;border-radius:10px;font-size:16px;text-align:center;outline:none;transition:border .2s;box-sizing:border-box;letter-spacing:4px}
.pwd-box input:focus{border-color:#7eb0c8}
.pwd-box .err{color:#e06060;font-size:12px;margin-top:8px;display:none}
.pwd-box .hint{font-size:11px;color:#bbb;margin-top:16px}
.pwd-hidden{display:none!important}

</style>
</head>
<body>
<div class="pwd-overlay" id="pwdGate">
  <div class="pwd-box">
    <h2>🔐 恩加数据汇总日报</h2>
    <div class="sub">请输入访问密码</div>
    <input type="password" id="pwdInput" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkPwd()" autofocus>
    <div class="err" id="pwdErr">密码错误，请重试</div>
  </div>
</div>
<script>
var PWD='enjia112233';
function checkPwd(){
  var v=document.getElementById('pwdInput').value;
  if(v===PWD){
    document.getElementById('pwdGate').classList.add('pwd-hidden');
    try{localStorage.setItem('enjia_auth','1');}catch(e){}
  }else{
    document.getElementById('pwdErr').style.display='block';
    document.getElementById('pwdInput').value='';
  }
}
(function(){
  try{if(localStorage.getItem('enjia_auth')==='1')document.getElementById('pwdGate').classList.add('pwd-hidden');}catch(e){}
})();
</script>

function ds(d){
  if(!d&&d!==0)return'';
  var s=String(d).trim();
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return parseInt(m[2])+'月'+parseInt(m[3])+'日';
  m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if(m)return parseInt(m[2])+'月'+parseInt(m[3])+'日';
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if(m)return parseInt(m[1])+'月'+parseInt(m[2])+'日';
  return s;
}

function fmt(n){
  if(n==null||isNaN(n)||n==='')return'0';
  if(typeof n==='string')n=parseFloat(n);
  if(isNaN(n))return'0';
  return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtExact(n){
  if(n==null||isNaN(n)||n==='')return'0';
  if(typeof n==='string')n=parseFloat(n);
  if(isNaN(n))return'0';
  return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function isNum(v){if(typeof v==='number')return!isNaN(v)&&isFinite(v);if(typeof v==='string'){if(v.match(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/))return false;var p=parseFloat(v);return!isNaN(p)&&isFinite(p)&&Math.abs(p)<10000000000;}return false;}
function skipCols(hdr){var s=[];for(var i=0;i<hdr.length;i++){var t=String(hdr[i]);if(t.includes('分日总计')||t.includes('归属账号'))s.push(i);}return s;}
function showCol(hdr,j){var sc=skipCols(hdr);return sc.indexOf(j)<0;}
function lastDataIdx(rows,sc){
  var last=-1;
  for(var i=1;i<rows.length;i++)for(var j=sc;j<rows[i].length;j++)if(isNum(rows[i][j])&&rows[i][j]!==0){var idx=j-sc;if(idx>last)last=idx;}
  return last;
}
function last7Dates(rows,sc){
  var last=lastDataIdx(rows,sc);if(last<0)return[];
  var begin=Math.max(0,last-6);
  return rows[0].slice(sc+begin,sc+last+1);
}
function saveData(){
  try{
    var save={};for(var k in DATA.sheets)save[k]=DATA.sheets[k];
    save._ts=new Date().toISOString();
    localStorage.setItem('enjia_data',JSON.stringify(save));
    document.getElementById('saveBadge').textContent='📅 已保存 '+new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }catch(e){}
}
function loadCpaFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var sheets=parseExcel(wb);
      var cpa=sheets['cpa分日现金统计'];
      if(!cpa){
        for(var k in sheets){cpa=sheets[k];if(cpa&&cpa.length&&cpa[0]&&String(cpa[0][0]).includes('日期'))break;}
      }
      if(cpa){

        var existing=DATA.sheets['cpa分日现金统计']||[];
        if(existing.length){
          var existMap={};for(var i=1;i<existing.length;i++){if(existing[i][0])existMap[existing[i][0]]=existing[i];}
          for(var i=1;i<cpa.length;i++){if(cpa[i][0])existMap[cpa[i][0]]=cpa[i];}
          var merged=[existing[0]];var keys=Object.keys(existMap).sort();for(var i=0;i<keys.length;i++)merged.push(existMap[keys[i]]);
          cpa=merged;
        }
        for(var mi=1;mi<cpa.length;mi++){if(cpa[mi][0]&&typeof cpa[mi][0]==='number')cpa[mi][0]=String(cpa[mi][0]);}
        DATA.sheets['cpa分日现金统计']=cpa;saveData();
        if(currentSheet==='cpa分日现金统计')render();
        else alert('✅ CPA数据已导入 ('+cpa.length+'行)，切换到CPA标签查看');
      }else{alert('未找到CPA数据，请确认表格格式');}
    }catch(err){alert('解析失败: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function loadData(){
  try{var raw=localStorage.getItem('enjia_data');if(raw){var save=JSON.parse(raw);delete save._ts;for(var k in save)DATA.sheets[k]=save[k];document.getElementById('saveBadge').textContent='📅 已加载缓存数据';return true;}}catch(e){}return false;
}
function resetData(){if(confirm('确定清除缓存恢复初始数据？')){localStorage.removeItem('enjia_data');location.reload();}}

function parseExcel(wb){
  var sheets={};
  for(var n=0;n<wb.SheetNames.length;n++){
    var name=wb.SheetNames[n],ws=wb.Sheets[name],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false}),rows=[];
    for(var r=0;r<raw.length;r++){
      var row=raw[r];if(!row)continue;
      var vals=row.map(function(v){
        if(v==null||v==='')return'';
        if(v instanceof Date){var y=v.getFullYear();var m2=String(v.getMonth()+1).padStart(2,"0");var d2=String(v.getDate()).padStart(2,"0");return y+"-"+m2+"-"+d2;}
        var sv=String(v).trim();
        if(sv.match(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/))return sv.replace(/\//g,'-');if(sv.match(/^\d{4}年\d{1,2}月\d{1,2}日$/)){var dm=sv.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);return dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');}if(sv.match(/^\d{1,2}月\d{1,2}日$/)){var dm2=sv.match(/(\d{1,2})月(\d{1,2})日/);return '2026-'+dm2[1].padStart(2,'0')+'-'+dm2[2].padStart(2,'0');}
        if(typeof v==='number'&&!isNaN(v)&&isFinite(v)){if(v>45400&&v<49000&&Number.isInteger(v)){var ed=new Date((v-25569)*86400*1000);return ed.getFullYear()+'-'+String(ed.getMonth()+1).padStart(2,'0')+'-'+String(ed.getDate()).padStart(2,'0');}return Math.round(v*100)/100;}
        if(!/[一-鿿]/.test(sv)){var pf=parseFloat(sv);if(!isNaN(pf)&&isFinite(pf)&&Math.abs(pf)<10000000000)return Math.round(pf*100)/100;}
        return sv;
      });
      while(vals.length&&vals[vals.length-1]==='')vals.pop();
      if(vals.some(function(v){return v!=='';}))rows.push(vals);
    }
    if(rows.length)sheets[name==='分日'?'cpa分日现金统计':name]=rows;
  }
  var cpa=sheets['cpa分日现金统计'];
  if(cpa)for(var i=1;i<cpa.length;i++){var r=cpa[i],s=0;if(r.length>=5)s=(isNum(r[2])?r[2]:0)+(isNum(r[3])?r[3]:0)+(isNum(r[4])?r[4]:0);if(s>0)r[1]=Math.round(s*100)/100;}
  return sheets;
}

function importSheets(sheets){for(var k in sheets)DATA.sheets[k]=sheets[k];saveData();render();}

function loadFile(file){
  var reader=new FileReader();
  reader.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:'array'});importSheets(parseExcel(wb));}catch(err){alert('解析失败: '+err.message);}};
  reader.readAsArrayBuffer(file);
}

  var mc=document.getElementById('mainContent');

    case'分日总数据':s1(mc,rows);break;
    case'代理商-产品分日消耗':s2(mc,rows);break;

  }
}

function s1(mc,rows){
  var dr=rows.slice(1).filter(function(r){return r[0]&&r[0]!=='信息流自营合计'&&r[0]!=='总合计';});
  dr=dr.filter(function(r){var sum=0;for(var j=1;j<r.length;j++)if(isNum(r[j]))sum+=r[j];return sum>0;});
  var q3Total=dr.reduce(function(s,r){return s+r.slice(1).filter(isNum).reduce(function(a,b){return a+b;},0);},0);
  var sumRow=rows.find(function(r){return r[0]==='总合计';});
  var firstDate=1;while(firstDate<rows[0].length&&!isNum(sumRow[firstDate]))firstDate++;
  var yesterday=sumRow&&firstDate<sumRow.length?sumRow[firstDate]:0;
  var maxCh='-',maxVal=0;
  if(firstDate<rows[0].length)for(var i=0;i<dr.length;i++){var v=dr[i][firstDate];if(isNum(v)&&v>maxVal){maxVal=v;maxCh=dr[i][0];}}
  var h='<div class="kpi-bar">';

  h+='<div class="kpi-item"><div class="kl">昨日消耗最大渠道</div><div class="kv" style="font-size:16px">'+maxCh+' ('+fmt(maxVal)+')</div></div>';
  h+='<div class="kpi-item"><div class="kl">活跃渠道数</div><div class="kv">'+dr.length+'个</div></div></div>';
  var sk1=skipCols(rows[0]);h+='<div style="text-align:right;margin-bottom:4px"><button class="export-btn" onclick="exportExcel()">📥 导出</button></div><div class="data-table"><div class="wrap"><table><thead><tr>'+rows[0].map(function(h,i){if(sk1.indexOf(i)>=0)return'';return'<th class="'+(i>0?'num':'tl')+'">'+(i>0?ds(h):h)+'</th>';}).join('')+'</tr></thead><tbody>';
  for(var i=0;i<dr.length;i++){var r=dr[i];h+='<tr>'+r.map(function(v,j){if(sk1.indexOf(j)>=0)return'';return'<td class="'+(j>0?'num':'tl')+'">'+(j>0?fmt(v):v)+'</td>';}).join('')+'</tr>';}
  var inf=rows.find(function(r){return r[0]==='信息流自营合计';});
  if(inf)h+='<tr class="sum-row">'+inf.map(function(v,j){if(sk1.indexOf(j)>=0)return'';return'<td class="'+(j>0?'num':'tl')+'">'+(j>0?fmt(v):v)+'</td>';}).join('')+'</tr>';
  if(sumRow)h+='<tr class="sum-row">'+sumRow.map(function(v,j){if(sk1.indexOf(j)>=0)return'';return'<td class="'+(j>0?'num':'tl')+'">'+(j>0?fmt(v):v)+'</td>';}).join('')+'</tr>';
h+='</tbody></table></div></div>';mc.innerHTML=h;
}

function s2(mc,rows){
  var dr=rows.slice(1).filter(function(r){return r[0]&&r[0]!=='合计';}),sumRow=rows.find(function(r){return r[0]==='合计';});
  var first=1;while(first<rows[0].length&&!isNum(rows[1][first]))first++;var begin=first,last=Math.min(first+6,rows[0].length-1);var d7=rows[0].slice(begin,last+1);
  var h='<div class="chart-card"><div class="ctitle">📊 最近7日消耗对比</div><canvas id="c2"></canvas></div>';
  var sk1=skipCols(rows[0]);h+='<div style="text-align:right;margin-bottom:4px"><button class="export-btn" onclick="exportExcel()">📥 导出</button></div><div class="data-table"><div class="wrap"><table><thead><tr>'+rows[0].map(function(h,i){if(sk1.indexOf(i)>=0)return'';return'<th class="'+(i>0?'num':'tl')+'">'+(i>0?ds(h):h)+'</th>';}).join('')+'</tr></thead><tbody>';
  for(var i=0;i<dr.length;i++){var r=dr[i];h+='<tr>'+r.map(function(v,j){if(sk1.indexOf(j)>=0)return'';return'<td class="'+(j>0?'num':'tl')+'">'+(j>0?fmt(v):v)+'</td>';}).join('')+'</tr>';}
  if(sumRow)h+='<tr class="sum-row">'+sumRow.map(function(v,j){if(sk1.indexOf(j)>=0)return'';return'<td class="'+(j>0?'num':'tl')+'">'+(j>0?fmt(v):v)+'</td>';}).join('')+'</tr>';
h+='</tbody></table></div></div>';mc.innerHTML=h;
  charts.c2=new Chart(document.getElementById('c2'),{type:'bar',data:{labels:d7.map(function(d){return ds(d);}),datasets:dr.map(function(r,i){return{label:r[0],data:r.slice(begin,last+1).map(function(v){return isNum(v)?v:0;}),backgroundColor:COLORS[i%COLORS.length],borderRadius:4};})},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:14,font:{size:10}}}},scales:{y:{ticks:{callback:function(v){return fmt(v);}},grid:{color:'#e4ecf2'}},x:{grid:{display:false}}}}});
}

// S3: 产品&渠道 — 分日总计(col4)不展示, top10 居中自适应, 明细表格左对齐
function s3(mc,rows){
  // header: 序号,平台,代理商-产品,产品名称,分日总计(SKIP),dates...
  var dr=rows.slice(1).filter(function(r){return r[3]&&String(r[3]).trim()!==''&&r[5]&&isNum(r[5]);});
  var first=5;while(first<rows[0].length&&!isNum(rows[1][first]))first++;var begin=first,last=Math.min(first+6,rows[0].length-1),days=last-begin+1;
  var ranked=dr.map(function(r){
    var sum=0;for(var j=begin;j<=last&&j<r.length;j++)if(isNum(r[j]))sum+=r[j];
    return{row:r,sum7d:sum};
  }).sort(function(a,b){return b.sum7d-a.sum7d;});
  var top10=ranked.slice(0,10);

  var h='<div class="rank-wrap"><div class="section-title">📦 最近7天 Top 10 产品消耗排名</div>';
  h+='<table class="rank-table"><thead><tr><th>排名</th><th class="tl">产品</th><th>平台</th><th class="num">近7日总消耗</th><th class="num">日均</th></tr></thead><tbody>';
  for(var i=0;i<top10.length;i++){
    var t=top10[i],hl='';if(i===0)hl='hl-1';else if(i===1)hl='hl-2';else if(i===2)hl='hl-3';
    h+='<tr class="'+hl+'"><td><span class="rank-badge '+(i<3?'r'+(i+1):'rn')+'">'+(i+1)+'</span></td><td class="tl">'+(t.row[3]||'')+'</td><td>'+(t.row[1]||'')+'</td><td class="num">'+fmt(t.sum7d)+'</td><td class="num">'+fmt(t.sum7d/days)+'</td></tr>';
  }
  h+='</tbody></table></div>';

  // 明细表格 — skip col4 (分日总计)
  h+='<div style="text-align:right;margin-bottom:4px"><button class="export-btn" onclick="exportExcel()">📥 导出</button></div><div class="data-table"><div class="wrap"><table><thead><tr>';
  var sk3=skipCols(rows[0]);for(var i=0;i<rows[0].length;i++)if(sk3.indexOf(i)<0)h+='<th class="'+(i>=4?'num':(i===0?'tl':''))+'">'+(i>=4?ds(rows[0][i]):(rows[0][i]||''))+'</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<dr.length;i++){var r=dr[i];h+='<tr>';
    for(var j=0;j<r.length;j++){if(sk3.indexOf(j)>=0)continue;h+='<td class="'+(j>=4?'num':(j===0?'tl':''))+'">'+(j>=4?fmt(r[j]):r[j])+'</td>';}
    h+='</tr>';
  }
  h+='</tbody></table></div></div>';
  mc.innerHTML=h;
}

// S4: 运营消耗 — 分日总计(col3)不展示, top10 居中自适应, 明细表格左对齐
function s4(mc,rows){
  // header: 部门,姓名,办公地点,分日总计(SKIP),dates...
  var dr=rows.slice(1).filter(function(r){return r[1]&&!String(r[1]).includes('合计');});
  var first=4;while(first<rows[0].length&&!isNum(rows[1][first]))first++;var begin=first,last=Math.min(first+6,rows[0].length-1),days=last-begin+1;
  var detail=DATA.sheets['消耗明细'];
  var personProduct={};
  if(detail){
    var ddr=detail.slice(1).filter(function(r){return r[0];});
    for(var i=0;i<ddr.length;i++){
      var r=ddr[i],person=r[6]||'',product=r[3]||'';
      if(!person||!product)continue;
      if(!personProduct[person])personProduct[person]={};
      var spend=0;for(var j=8;j<r.length;j++)if(isNum(r[j]))spend+=r[j];
      personProduct[person][product]=(personProduct[person][product]||0)+spend;
    }
  }
  function topProduct(person){
    var pp=personProduct[person];if(!pp)return'—';
    var best='',bestV=0;for(var k in pp)if(pp[k]>bestV){bestV=pp[k];best=k;}return best||'—';
  }
  var ranked=dr.map(function(r){
    var sum=0;for(var j=begin;j<=last&&j<r.length;j++)if(isNum(r[j]))sum+=r[j];
    return{row:r,sum7d:sum,avg:sum/days};
  }).sort(function(a,b){return b.avg-a.avg;});
  var top10=ranked.slice(0,10);

  var h='<div class="rank-wrap"><div class="section-title">👤 最近7天 Top 10 运营日均消耗排名</div>';
  h+='<table class="rank-table"><thead><tr><th>排名</th><th class="tl">姓名</th><th>部门</th><th>主投产品</th><th class="num">近7日日均</th><th class="num">近7日总计</th></tr></thead><tbody>';
  for(var i=0;i<top10.length;i++){
    var t=top10[i],hl='';if(i===0)hl='hl-1';else if(i===1)hl='hl-2';else if(i===2)hl='hl-3';
    h+='<tr class="'+hl+'"><td><span class="rank-badge '+(i<3?'r'+(i+1):'rn')+'">'+(i+1)+'</span></td><td class="tl">'+(t.row[1]||'')+'</td><td>'+(t.row[0]||'')+'</td><td>'+topProduct(t.row[1])+'</td><td class="num">'+fmt(t.avg)+'</td><td class="num">'+fmt(t.sum7d)+'</td></tr>';
  }
  h+='</tbody></table></div>';

  // 明细表格 — skip col3 (分日总计)
  h+='<div style="text-align:right;margin-bottom:4px"><button class="export-btn" onclick="exportExcel()">📥 导出</button></div><div class="data-table"><div class="wrap"><table><thead><tr>';
  var sk4=skipCols(rows[0]);for(var i=0;i<rows[0].length;i++)if(sk4.indexOf(i)<0)h+='<th class="'+(i>=3?'num':(i===0?'tl':''))+'">'+(i>=3?ds(rows[0][i]):(rows[0][i]||''))+'</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<dr.length;i++){var r=dr[i];h+='<tr>';
    for(var j=0;j<r.length;j++){if(sk4.indexOf(j)>=0)continue;h+='<td class="'+(j>=3?'num':(j===0?'tl':''))+'">'+(j>=3?fmt(r[j]):r[j])+'</td>';}
    h+='</tr>';
  }
  h+='</tbody></table></div></div>';
  mc.innerHTML=h;
}

function s5(mc,rows){
  var hdr=rows[0],dr=rows.slice(1);
  var hideCols=[];
  for(var i=0;i<hdr.length;i++){var t=String(hdr[i]||'');if(t.includes('归属账号')||t.includes('分日总计'))hideCols.push(i);}
  var channels={},products={};
  for(var i=0;i<dr.length;i++){var r=dr[i];if(r[0])channels[r[0]]=1;if(r[3])products[r[3]]=1;}
  var chList=Object.keys(channels).sort(),prList=Object.keys(products).sort();
  var operators={};for(var i=0;i<dr.length;i++){if(dr[i][6])operators[dr[i][6]]=1;}
  var opList=Object.keys(operators).sort();
  var h='<div class="filter-row"><select id="f5ch" onchange="fd5()"><option value="">全部渠道</option>'+chList.map(function(c){return'<option>'+c+'</option>';}).join('')+'</select>';
  h+='<select id="f5pr" onchange="fd5()"><option value="">全部产品</option>'+prList.map(function(p){return'<option>'+p+'</option>';}).join('')+'</select>';
  h+='<select id="f5op" onchange="fd5()"><option value="">全部运营</option>'+opList.map(function(o){return'<option>'+o+'</option>';}).join('')+'</select>';
  h+='<input id="f5min" type="number" placeholder="最低消耗" onchange="fd5()"><span style="font-size:12px;color:var(--sub)" id="f5cnt"></span></div>';
  h+='<div style="text-align:right;margin-bottom:4px"><button class="export-btn" onclick="exportExcel()">📥 导出</button></div><div class="data-table"><div class="wrap"><table><thead><tr>';
  for(var i=0;i<hdr.length;i++){if(hideCols.indexOf(i)<0)h+='<th class="'+(i===0?'tl':'')+'">'+ds(hdr[i])+'</th>';}
  h+='</tr></thead><tbody id="tb5"></tbody></table></div></div>';
  DATA._s5={hdr:hdr,dr:dr,hideCols:hideCols};
  mc.innerHTML=h;fd5();
}

function fd5(){
  var ch=document.getElementById('f5ch').value,pr=document.getElementById('f5pr').value,op=document.getElementById('f5op').value,min=parseFloat(document.getElementById('f5min').value)||0;
  var s5=DATA._s5,hdr=s5.hdr,dr=s5.dr,hide=s5.hideCols;
  var filtered=dr.filter(function(r){
    if(!r||!r[0])return false;
    if(ch&&String(r[0])!==ch)return false;
    if(pr&&String(r[3])!==pr)return false;
    if(op&&String(r[6])!==op)return false;
    if(min>0){var t=0;for(var j=0;j<r.length;j++)if(hide.indexOf(j)<0&&isNum(r[j]))t+=r[j];if(t<min)return false;}
    return true;
  });
  document.getElementById('f5cnt').textContent='共 '+filtered.length+' 条';
  var ncols=hdr.length,totals=[];for(var j=0;j<ncols;j++)totals[j]=0;
  var tb='';
  for(var i=0;i<filtered.length;i++){
    var r=filtered[i],isSum=i===filtered.length-1&&String(r[0]||'').includes('合计');
    if(!isSum)for(var j=0;j<ncols;j++){if(hide.indexOf(j)<0&&isNum(r[j]))totals[j]=(totals[j]||0)+r[j];}
    tb+='<tr'+(isSum?' class="sum-row"':'')+'>';
    for(var j=0;j<ncols;j++){
      if(hide.indexOf(j)>=0)continue;
      var v=r[j];
      tb+='<td class="'+(j===0?'tl':'')+'">'+(isNum(v)&&j!==2?fmt(v):(v!=null?String(v):''))+'</td>';
    }
    tb+='</tr>';
  }
  var lastRow=filtered.length>0?filtered[filtered.length-1]:null;
  var hasSum=lastRow&&String(lastRow[0]||'').includes('合计');
  if(!hasSum){
    tb+='<tr class="sum-row">';
    for(var j=0;j<ncols;j++){if(hide.indexOf(j)>=0)continue;tb+='<td class="'+(j===0?'tl':'')+'">'+(totals[j]&&totals[j]!==0?fmt(totals[j]):'')+'</td>';}
    tb+='</tr>';
  }
  document.getElementById('tb5').innerHTML=tb;
}

function s6(mc,rows){
  var hdr=rows[0],dataRows=[];for(var i=1;i<rows.length;i++){var r=rows[i];if(r[0])dataRows.push(r);}
  var hasData=dataRows.filter(function(r){return isNum(r[2])&&r[2]!==0;});
  var last=hasData[hasData.length-1];
  var ytCpa=last&&isNum(last[2])?last[2]:0,ytLm=last&&isNum(last[3])?last[3]:0,ytKs=last&&isNum(last[4])?last[4]:0;
  var curMon=parseInt(new Date().getMonth()+1);var qtrStart=Math.ceil(curMon/3)*3-2,qtrEnd=qtrStart+2;var qtrCpa=0,monCpa=0;for(var i=0;i<hasData.length;i++){var r=hasData[i],dm=parseInt((String(r[0]||'').match(/^\d{4}-(\d{1,2})/)||[])[1]);if(dm){if(dm>=qtrStart&&dm<=qtrEnd){if(isNum(r[2]))qtrCpa+=r[2];if(isNum(r[3]))qtrCpa+=r[3];if(isNum(r[4]))qtrCpa+=r[4];}if(dm===curMon){if(isNum(r[2]))monCpa+=r[2];if(isNum(r[3]))monCpa+=r[3];if(isNum(r[4]))monCpa+=r[4];}}}
  var h='<div class="kpi-bar">';
  h+='<div class="kpi-item"><div class="kl">Q3现金总消耗</div><div class="kv">'+fmtExact(qtrCpa)+' 元</div></div>';
  h+='<div class="kpi-item"><div class="kl">当月现金总消耗</div><div class="kv">'+fmtExact(monCpa)+' 元</div></div>';
  h+='<div class="kpi-item"><div class="kl">昨日现金总消耗</div><div class="kv">'+fmtExact(ytCpa+ytLm+ytKs)+' 元</div></div>';
  h+='<div class="kpi-item"><div class="kl">昨日美团CPA现金消耗</div><div class="kv">'+fmtExact(ytCpa)+'</div></div>';
  h+='<div class="kpi-item"><div class="kl">昨日美团联盟现金消耗</div><div class="kv">'+fmtExact(ytLm)+'</div></div>';
  h+='<div class="kpi-item"><div class="kl">昨日快手CPA现金消耗</div><div class="kv">'+fmtExact(ytKs)+'</div></div>';
  h+='</div>';
  h+='<div class="chart-card"><div class="ctitle">📈 CPA现金消耗日趋势</div><canvas id="cpaT"></canvas></div>';
  h+='<div style="text-align:right;margin-bottom:4px"><button class="export-btn" onclick="exportExcel()">📥 导出</button></div><div class="data-table"><div class="wrap"><table><thead><tr>'+hdr.map(function(h,i){return'<th class="'+(i>0?'num':'tl')+'">'+ds(h)+'</th>';}).join('')+'</tr></thead><tbody>';
  for(var i=0;i<dataRows.length;i++){var r=dataRows[i],isF=!isNum(r[2])||r[2]===0;h+='<tr'+(isF?' style="color:#ccc"':'')+'>';
    for(var j=0;j<hdr.length;j++){var v=r[j];if(j===0)h+='<td class="tl">'+ds(String(v||''))+'</td>';else h+='<td class="num">'+(isNum(v)?fmt(v):(v||'—'))+'</td>';}h+='</tr>';
  }
  var cpaTotals=['合计'];for(var ci=1;ci<hdr.length;ci++){var sum=0;for(var ri=0;ri<dataRows.length;ri++){var vv=dataRows[ri][ci];if(isNum(vv))sum+=vv;}cpaTotals.push(sum>0?sum:'');}h+='<tr class="sum-row">'+cpaTotals.map(function(v,i){return'<td class="'+(i>0?'num':'tl')+'">'+(i>0&&isNum(v)?fmt(v):(v||''))+'</td>';}).join('')+'</tr>';
h+='</tbody></table></div></div>';mc.innerHTML=h;
  var ls=hasData.map(function(r){return ds(r[0]);});
  charts.cpaT=new Chart(document.getElementById('cpaT'),{type:'line',data:{labels:ls,datasets:[{label:'美团CPA',data:hasData.map(function(r){return isNum(r[2])?r[2]:0;}),borderColor:COLORS[0],backgroundColor:'rgba(126,176,200,0.12)',fill:true,tension:.3,pointRadius:2},{label:'美团联盟',data:hasData.map(function(r){return isNum(r[3])?r[3]:0;}),borderColor:COLORS[1],backgroundColor:'rgba(168,201,165,0.12)',fill:true,tension:.3,pointRadius:2},{label:'快手CPA',data:hasData.map(function(r){return isNum(r[4])?r[4]:0;}),borderColor:COLORS[2],backgroundColor:'rgba(232,192,119,0.12)',fill:true,tension:.3,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:14,font:{size:10}}}},scales:{y:{ticks:{callback:function(v){return fmt(v);}},grid:{color:'#e4ecf2'}},x:{grid:{display:false}}},interaction:{mode:'index',intersect:false}}});
}

function exportExcel(){
  var rows=DATA.sheets[currentSheet];
  if(!rows||!rows.length){alert('当前标签无数据');return;}
  var clean=rows.map(function(r){return r.map(function(v){if(v==null||v==='')return'';if(typeof v==='number')return Math.round(v*100)/100;return String(v);});});
  var ws=XLSX.utils.aoa_to_sheet(clean);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,currentSheet);
  XLSX.writeFile(wb,'恩加数据_'+currentSheet+'.xlsx');
}

render();
</script>
